[project]
name = "decision-before-feature"
version = "0.1.0"
description = "Offline trajectory, landscape-query utility, and decision-model experiments for Decision-before-Feature"
authors = [
    { name = "BingChen", email = "1030339437@QQ.COM" }
]
requires-python = ">=3.12"
dependencies = [
    "coco-experiment>=2.8.2",
    "ioh==0.3.22",
    "lightgbm>=4.7.0",
    "numpy>=2.5.1",
    "opfunu>=1.0.4",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "setuptools<81",
    "shape>=0.1.1",
    "tabulate>=0.9.0",
    "threadpoolctl>=3.6.0",
    "xgboost>=3.4.1",
]

[project.scripts]
phase1-collect-batch = "experiments.cli.phase1_collect_batch:main"
phase1-check-config = "experiments.cli.phase1_check_config:main"
phase1-plan-shards = "experiments.cli.phase1_plan_shards:main"
phase1-check-trajectory-shards = "experiments.cli.phase1_check_trajectory_shards:main"
generate-mabbob-diversity-pool = "experiments.cli.generate_mabbob_diversity_pool:main"
select-mabbob-formal-subset = "experiments.cli.select_mabbob_formal_subset:main"
selection-reference-check = "experiments.cli.selection_reference_consistency:main"
behavior-ela-collect = "behavior_with_ela.collection:main"
behavior-ela-build-actions = "behavior_with_ela.action_dataset:main"
behavior-ela-train = "behavior_with_ela.model:main"
behavior-ela-online = "behavior_with_ela.online:main"
behavior-ela-compare-baselines = "behavior_with_ela.baselines:main"
behavior-ela-compare-local = "behavior_with_ela.phase2:main"
behavior-ela-build-query-actions = "behavior_with_ela.phase3_query_data:main"
behavior-ela-train-query-policy = "behavior_with_ela.phase3:main"
behavior-ela-build-soft-ert = "behavior_with_ela.phase4_soft_ert:main"
behavior-ela-repeated-das = "behavior_with_ela.repeated_das:main"
behavior-ela-online-query = "behavior_with_ela.adaptive_query_online:main"
behavior-ela-online-compare = "behavior_with_ela.online_comparison:main"
behavior-ela-collect-traditional-aas = "behavior_with_ela.traditional_aas:collect_main"
behavior-ela-train-traditional-aas = "behavior_with_ela.traditional_aas:train_main"
behavior-ela-train-gfe-gate = "behavior_with_ela.gfe_query_gate:main"
behavior-extract = "behavior.extraction:main"
behavior-extract-batch = "behavior.batch_extraction:main"
query-sample-batch = "landscape_queries.batch_sampling:main"
query-extract-cheap = "landscape_queries.batch_features:main"
query-consistency = "landscape_queries.consistency:main"
selection-reference-evaluate-actions = "selection_reference.action_losses:main"
selection-reference-build = "selection_reference.build:main"
selection-reference-compare-selectors = "selection_reference.compare_selector_models:main"
as-lgbm-reproduce = "baselines.as_lgbm_reproduction:main"
as-lgbm-generate-rgi = "baselines.rgi_batch:main"
utility-labels-generate = "utility_labels.generation:main"
utility-labels-generate-batch = "utility_labels.batch_generation:main"
utility-labels-validate = "utility_labels.validation:main"
decision-train-full = "decision.train_full_decision_model:main"
decision-compare-feature-groups = "decision.compare_feature_group_training:main"
decision-check-model-protocol = "decision.check_model_protocol:main"
decision-compare-controller-baselines = "decision.compare_controller_baselines:main"
decision-online-controller-evaluate = "decision.online_controller_evaluate:main"
decision-validation-online-evaluate = "decision.validation_online_evaluate:main"
decision-replay-complete-paths = "decision.complete_path_replay:main"
decision-build-static-vbs = "decision.static_portfolio_reference:main"
cec2017-online-compare = "experiments.cli.cec2017_representative_online_compare:main"
cec2017-feature-shift = "experiments.analysis.cec2017_feature_shift:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["benchmarks*", "optimizers*", "trajectory*", "experiments*", "behavior*", "behavior_with_ela*", "landscape_queries*", "selection_reference*", "utility_labels*", "decision*", "baselines*"]
