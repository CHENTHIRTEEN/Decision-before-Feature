name: ci

on:
  push:
  pull_request:

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Run static checks
        run: |
          uv run python -m py_compile \
            experiments/algorithm_consistency_check.py \
            experiments/stage0_resource_check.py \
            experiments/phase1_check_config.py \
            experiments/phase1_check_trajectory_shards.py \
            optimizers/state.py
      - name: Run tiny verification scripts
        run: |
          uv run python experiments/stage0_resource_check.py configs/phase1_bbob_train.yaml configs/phase1_bbob_validation.yaml configs/phase1_cec2017_test.yaml
          uv run python experiments/algorithm_consistency_check.py --suite bbob --max-runs 1
